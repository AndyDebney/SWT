models:
  - name: stg_brands
    data_tests:
      - unique:
          arguments:
            column_name: >-
              concat("source_file", '::', to_varchar("record_line_no"))
      - not_null_columns_lowercase:
          arguments:
            column_names: [source_file, record_line_no]

