models:
  - name: stg_brands
    description: Staging model for raw brand records from `ADEBNEYDEMODB4.RAW.BRANDS`. Preserves source column names.
    columns:
      - name: _file
        description: Source column `_FILE` (TEXT).
      - name: _line
        description: Source column `_LINE` (NUMBER).
      - name: _modified
        description: Source column `_MODIFIED` (TIMESTAMP_TZ).
      - name: _fivetran_synced
        description: Source column `_FIVETRAN_SYNCED` (TIMESTAMP_TZ).
      - name: brand_id
        description: Source column `BRAND_ID` (NUMBER).
        data_tests:
          - unique
          - not_null
      - name: brand_name
        description: Source column `BRAND_NAME` (TEXT).

  - name: stg_categories
    description: Staging model for raw product category records from `ADEBNEYDEMODB4.RAW.CATEGORIES`. Preserves source column names.
    columns:
