      - name: order_id
        description: Source column `ORDER_ID` (NUMBER).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: item_id
        description: Source column `ITEM_ID` (NUMBER).
        data_tests:
          - not_null
      - name: product_id
        description: Source column `PRODUCT_ID` (NUMBER).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: quantity
        description: Source column `QUANTITY` (NUMBER).
        data_tests:
          - not_null
      - name: list_price
        description: Source column `LIST_PRICE` (FLOAT).
      - name: discount
        description: Source column `DISCOUNT` (FLOAT).

