models:
  - name: stg_brands
    description: Staging view of the raw brands source; preserves the raw schema.
    data_tests:
      - unique:
          arguments:
            column_name: concat(_FILE, '::', to_varchar(_LINE))
    columns:
      - name: _FILE
        data_tests:
          - not_null
      - name: _LINE
        data_tests:
          - not_null
      - name: _MODIFIED
      - name: _FIVETRAN_SYNCED
