      - name: _fivetran_synced
        description: Source column `_FIVETRAN_SYNCED` (TIMESTAMP_TZ).
      - name: category_id
        description: Source column `CATEGORY_ID` (NUMBER).
        data_tests:
          - unique
          - not_null
      - name: category_name
        description: Source column `CATEGORY_NAME` (TEXT).

  - name: stg_customers
    description: Staging model for raw customer records from `ADEBNEYDEMODB4.RAW.CUSTOMERS`. Preserves source column names.
    columns:
      - name: _file
        description: Source column `_FILE` (TEXT).
      - name: _line
        description: Source column `_LINE` (NUMBER).
      - name: _modified
        description: Source column `_MODIFIED` (TIMESTAMP_TZ).
      - name: _fivetran_synced
        description: Source column `_FIVETRAN_SYNCED` (TIMESTAMP_TZ).
      - name: customer_id
        description: Source column `CUSTOMER_ID` (NUMBER).
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Source column `FIRST_NAME` (TEXT).
      - name: last_name
        description: Source column `LAST_NAME` (TEXT).
      - name: phone
        description: Source column `PHONE` (TEXT).
      - name: email
        description: Source column `EMAIL` (TEXT).
      - name: street
        description: Source column `STREET` (TEXT).
      - name: city
        description: Source column `CITY` (TEXT).
      - name: state
        description: Source column `STATE` (TEXT).
      - name: zip_code
        description: Source column `ZIP_CODE` (NUMBER).

  - name: stg_orders
    description: Staging model for raw order header records from `ADEBNEYDEMODB4.RAW.ORDERS`. Preserves source column names.
    columns:
      - name: _file
        description: Source column `_FILE` (TEXT).
      - name: _line
        description: Source column `_LINE` (NUMBER).
      - name: _modified
        description: Source column `_MODIFIED` (TIMESTAMP_TZ).
      - name: _fivetran_synced
        description: Source column `_FIVETRAN_SYNCED` (TIMESTAMP_TZ).
      - name: order_id
        description: Source column `ORDER_ID` (NUMBER).
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Source column `CUSTOMER_ID` (NUMBER).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        description: Source column `ORDER_STATUS` (NUMBER).
      - name: order_date
        description: Source column `ORDER_DATE` (DATE).
      - name: required_date
        description: Source column `REQUIRED_DATE` (DATE).
      - name: shipped_date
        description: Parsed date from source column `SHIPPED_DATE` (TEXT).
      - name: store_id
        description: Source column `STORE_ID` (NUMBER).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stores')
                field: store_id
      - name: staff_id
        description: Source column `STAFF_ID` (NUMBER).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_staffs')
                field: staff_id

  - name: stg_order_items
    description: Staging model for raw line-item records for orders from `ADEBNEYDEMODB4.RAW.ORDER_ITEMS`. Preserves source column names.
    columns:
