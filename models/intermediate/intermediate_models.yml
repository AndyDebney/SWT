  - name: int_customer_order_value
    description: Order-level customer value model used for CLV analysis. Includes only orders where `order_status = 1`.
    columns:
      - name: order_id
        description: Qualifying order identifier.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the qualifying order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_customers')
                field: customer_id
      - name: order_status
        description: Order status carried from `int_orders`; filtered to status `1` in this model.
      - name: order_date
        description: Order date for the qualifying order.
      - name: required_date
        description: Required date for the qualifying order.
      - name: shipped_date
        description: Shipped date for the qualifying order.
      - name: store_id
        description: Store associated with the qualifying order.
      - name: staff_id
        description: Staff member associated with the qualifying order.
      - name: order_line_count
        description: Number of line items on the qualifying order.
      - name: distinct_products_ordered
        description: Number of distinct products on the qualifying order.
      - name: total_units_ordered
        description: Total units on the qualifying order.
      - name: gross_order_value
        description: Gross order value calculated as `sum(quantity * list_price * (1 - discount))`.
        data_tests:
          - not_null

  - name: int_customer_support_summary
    description: Customer-level support summary used alongside CLV analysis.
    columns:
      - name: customer_id
        description: Customer identifier for the support summary row.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_customers')
                field: customer_id
      - name: first_support_interaction_at
        description: Timestamp of the customer's first recorded support interaction.
      - name: last_support_interaction_at
        description: Timestamp of the customer's most recent recorded support interaction.
      - name: support_interaction_count
        description: Count of support interactions for the customer.
      - name: supported_order_count
        description: Count of distinct orders referenced in support interactions.
      - name: supported_product_count
        description: Count of distinct products referenced in support interactions.
      - name: avg_csat_score
        description: Average CSAT score across the customer's support interactions.
      - name: avg_sentiment_score
        description: Average sentiment score across the customer's support interactions.
      - name: avg_resolution_minutes
        description: Average resolution time in minutes across the customer's support interactions.
      - name: resolved_interaction_count
        description: Count of resolved support interactions.
      - name: unresolved_interaction_count
        description: Count of unresolved support interactions.
      - name: follow_up_required_count
        description: Count of support interactions marked as requiring follow-up.
      - name: total_support_cost
        description: Total support cost associated with the customer.
      - name: total_refund_amount
        description: Total refund amount associated with the customer.
