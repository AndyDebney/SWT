models:
  - name: int_customer_order_items
    description: Order-item purchase facts enriched with product category and net demand across all order statuses.
    data_tests:
      - unique:
          arguments:
            column_name: concat(order_id, '::', item_id)
    columns:
      - name: order_id
        data_tests:
          - not_null
      - name: item_id
        data_tests:
          - not_null
      - name: customer_id
        data_tests:
          - not_null

  - name: int_customer_sales_by_customer
    description: Lifetime purchase and demand features at one row per customer across all order statuses.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: int_customer_category_purchases
    description: Customer purchase history at one row per customer and product category.
    data_tests:
      - unique:
          arguments:
            column_name: concat(customer_id, '::', category_id)
    columns:
      - name: customer_id
        data_tests:
          - not_null
      - name: category_id
        data_tests:
          - not_null

  - name: int_category_cross_sell_affinity
    description: Directional category affinity based on customers who have purchased both categories.
    data_tests:
      - unique:
          arguments:
            column_name: concat(source_category_id, '::', target_category_id)

  - name: int_customer_support_by_customer
    description: Customer support features at one row per customer with support interactions.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: int_customer_category_cross_sell_candidates
    description: Ranked unpurchased category candidates at one row per customer and target category.
    data_tests:
      - unique:
          arguments:
            column_name: concat(customer_id, '::', target_category_id)
